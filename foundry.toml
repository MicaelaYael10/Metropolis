[profile.default]
# Los contratos viven en contracts/ (estructura heredada del proyecto).
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./data" }]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
avax_fuji = "https://api.avax-test.network/ext/bc/C/rpc"
avax_mainnet = "https://api.avax.network/ext/bc/C/rpc"

# Verificacion en el explorador. Requiere SNOWTRACE_API_KEY en el entorno (.env).
# Obtener la clave en https://snowtrace.io/apis (Fuji: https://testnet.snowtrace.io/apis).
[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143, url = "https://testnet.monadexplorer.com/api" }
avax_fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113 }
avax_mainnet = { key = "${SNOWTRACE_API_KEY}", chain = 43114 }
